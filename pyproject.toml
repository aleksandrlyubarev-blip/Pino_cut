[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pinocut"
version = "1.0.0"
description = "Modular AI video assembly agent for Andrew Swarm ecosystem"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Alex", email = "alex@romeoflexvision.dev" }]

dependencies = [
    "moviepy>=1.0.3",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "langgraph>=0.2.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0.0"]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]
full = [
    "faster-whisper>=1.0.0",
    "e2b>=0.17.0",
    "litellm>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
]

[project.scripts]
pinocut = "pinocut.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
